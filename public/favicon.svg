<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F1ED"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBFA8"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
  </defs>

  <!-- Warm Notion charcoal squircle base -->
  <rect width="64" height="64" rx="16" fill="#37352F"/>
  <!-- Subtle highlight border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2"/>

  <!-- WaveNote 'W' signature wave -->
  <path d="M15 22 L23 44 L32 26 L41 44 L49 22" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Warm accent sparkle dot -->
  <circle cx="48" cy="18" r="3.5" fill="url(#sparkGrad)"/>
</svg>
